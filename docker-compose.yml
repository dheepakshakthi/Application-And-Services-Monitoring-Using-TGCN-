version: '3.8'

services:
  app:
    build: ./src
    ports:
      - "8000:8000"
    environment:
      - SERVICE_NAME=app
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - LOG_FILE=/data/telemetry_data.csv
    volumes:
      - ./data:/data
    depends_on:
      - otel-collector
      - svc1
      - svc2
      - svc3

  svc1:
    build: ./src
    environment:
      - SERVICE_NAME=svc1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - LOG_FILE=/data/telemetry_data.csv
    volumes:
      - ./data:/data
    depends_on:
      - otel-collector

  svc2:
    build: ./src
    environment:
      - SERVICE_NAME=svc2
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - LOG_FILE=/data/telemetry_data.csv
    volumes:
      - ./data:/data
    depends_on:
      - otel-collector

  svc3:
    build: ./src
    environment:
      - SERVICE_NAME=svc3
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - LOG_FILE=/data/telemetry_data.csv
    volumes:
      - ./data:/data
    depends_on:
      - otel-collector

  otel-collector:
    image: otel/opentelemetry-collector:0.100.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "14250:14250"

  portal:
    build:
      context: .
      dockerfile: portal/Dockerfile
    environment:
      - APP_URL=http://app:8000/
      - TELEMETRY_FILE=/data/telemetry_data.csv
      - MODEL_BUNDLE=/artifacts/tgcn/tgcn_inference_bundle.pt
      - PORT=5050
    volumes:
      - ./data:/data
      - ./artifacts:/artifacts
    ports:
      - "5050:5050"
    depends_on:
      - app
      - svc1
      - svc2
      - svc3
